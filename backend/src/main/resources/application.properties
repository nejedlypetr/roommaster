spring.application.name=backend
server.port=8080

# Database connection. Override DB_URL, DB_USERNAME, and DB_PASSWORD for another database.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/roommaster?stringtype=unspecified&currentSchema=room_master}
spring.datasource.username=${DB_USERNAME:roommaster}
spring.datasource.password=${DB_PASSWORD:roommaster}

# Database platform configuration for JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logging configuration
logging.level.root=INFO
logging.level.cvut.pm2.backend=DEBUG
logging.file.name=logs/application.log

# JWT. Set JWT_SECRET to a random value of at least 32 bytes outside local development.
app.jwt.secret=${JWT_SECRET:roommaster-local-dev-jwt-secret-key}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Swagger configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=cvut.pm2.backend
