services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: roommaster
      POSTGRES_USER: roommaster
      POSTGRES_PASSWORD: roommaster
    ports:
      - "5432:5432"
    volumes:
      - ./backend/sql/scheme.sql:/docker-entrypoint-initdb.d/01-scheme.sql:ro
      - ./backend/sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roommaster -d roommaster"]
      interval: 5s
      timeout: 5s
      retries: 10
